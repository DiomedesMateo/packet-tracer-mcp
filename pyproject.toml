[project]
name = "packet-tracer-mcp"
version = "0.1.0"
description = "MCP server for Cisco Packet Tracer - create and control network topologies in real time from OpenCode / Claude / Cursor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Packet Tracer MCP" }]
dependencies = [
    "mcp[cli]>=1.2.0,<3",
    "pydantic>=2.0",
    "httpx>=0.27.0",
]

[project.scripts]
packet-tracer-mcp = "packet_tracer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packet_tracer_mcp"]
